[project]
name = "kirowhisper"
version = "0.1.0"
description = "Voice-driven ambient oversight for autonomous Kiro Crew — hear only the decisions that matter."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Mehmet Akif Acar" }]
keywords = ["mcp", "kiro-crew", "alexa", "accessibility", "agentic", "voice", "bedrock"]

dependencies = [
    "httpx>=0.27",
    "mcp>=1.2",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
kirowhisper = "kirowhisper.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
